<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020712">
<title>WOLF JARVIS ULTIMATE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020712;color:#dffaff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;text-align:center;
 border-bottom:1px solid #075b77;
}
.logo{
 color:#00dfff;font-size:25px;
 letter-spacing:5px;font-weight:bold;
 text-shadow:0 0 15px #00cfff;
}
.status{color:#00ffae;font-size:12px;margin-top:10px}
main{max-width:650px;margin:auto;padding:20px}
.hero{text-align:center;padding:25px 0}
.wolf{
 width:165px;height:165px;border:3px solid #00dfff;
 border-radius:50%;margin:10px auto;
 display:grid;place-items:center;font-size:75px;
 box-shadow:0 0 35px #00bfff,inset 0 0 25px #007caa;
 animation:pulse 2s infinite;
}
@keyframes pulse{
 50%{box-shadow:0 0 55px #00dfff,inset 0 0 35px #007caa}
}
h2{color:#00dfff;letter-spacing:3px}
.panel{
 background:#071525;border:1px solid #075b77;
 border-radius:18px;padding:16px;margin-top:18px;
}
#chat{
 height:260px;overflow-y:auto;
 display:flex;flex-direction:column;gap:12px;
}
.msg{
 padding:12px;border-radius:12px;
 max-width:90%;line-height:1.5;
 overflow-wrap:anywhere;
}
.user{align-self:flex-end;background:#06435b}
.bot{align-self:flex-start;background:#10263b}
.controls{display:flex;gap:8px;margin-top:12px}
input{
 min-width:0;flex:1;background:#020b17;
 border:1px solid #00bddd;border-radius:12px;
 color:white;padding:14px;font-size:15px;
}
button{
 background:#06344a;color:#00e5ff;
 border:1px solid #00cfff;border-radius:12px;
 padding:12px 17px;font-weight:bold;
}
button:active{background:#08708c}
#mic{width:100%;margin-top:10px}
footer{text-align:center;color:#477b91;padding:25px;font-size:12px}
</style>
</head>

<body>
<header>
 <div class="logo">🐺 WOLF JARVIS</div>
 <div class="status">● SYSTEM ONLINE</div>
</header>

<main>
 <section class="hero">
  <div class="wolf">🐺</div>
  <h2>ULTIMATE AI</h2>
  <p>Your Personal AI Assistant</p>
  <p class="status">GEMINI AI CONNECTED</p>
 </section>

 <section class="panel">
  <h3>💬 JARVIS CHAT</h3>
  <div id="chat">
   <div class="msg bot">
    Vanakkam! நான் WOLF JARVIS AI.
    How can I help you?
   </div>
  </div>

  <div class="controls">
   <input id="message" placeholder="Ask me anything...">
   <button onclick="sendMessage()">SEND</button>
  </div>

  <button id="mic" onclick="startVoice()">🎙️ VOICE COMMAND</button>
 </section>

 <footer>
  WOLF JARVIS ULTIMATE<br>
  POWERED BY GEMINI AI
 </footer>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;

 input.value="";
 addMessage(message,"user");
 const loading=addMessage("JARVIS THINKING...","bot");

 try{
  const response=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();
  loading.textContent=data.reply||"No response received.";

  if(response.ok && "speechSynthesis" in window){
   const speech=new SpeechSynthesisUtterance(data.reply);
   speech.lang=/[\u0B80-\u0BFF]/.test(data.reply)?"ta-IN":"en-IN";
   speechSynthesis.cancel();
   speechSynthesis.speak(speech);
  }
 }catch(error){
  loading.textContent="JARVIS OFFLINE. Check your server.";
 }
}

function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  alert("Voice recognition unavailable in this browser.");
  return;
 }
 const recognition=new SR();
 recognition.lang="ta-IN";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>addMessage("Voice recognition failed.","bot");
 recognition.start();
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
